name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked project
        run: uv sync --frozen --group dev --python python

      - name: Run unit and documentation tests
        run: uv run --frozen pytest -m "not device"

      - name: Run Ruff baseline
        run: uv run --frozen ruff check .

      - name: Run CLI smoke test
        run: uv run --frozen python alred.py --help

  binary-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked build environment
        run: uv sync --frozen --group dev --group build --python python

      - name: Build native PyInstaller binary
        run: >-
          uv run --python 3.11 --group build --frozen pyinstaller
          --clean --noconfirm alred.spec

      - name: Smoke-test binary
        run: |
          ./dist/alred --version
          ./dist/alred --help
          ./dist/alred generate-sample-config \
            --output-dir "${RUNNER_TEMP}/alred-samples"
          set +e
          ./dist/alred health-check snapshot \
            --input tests/fixtures/nxos/device_summary/transcript_inventory_license.txt \
            --input-format nxos-transcript \
            --phase before \
            --purpose inspection \
            --change-id CI-BINARY-PARSER \
            --operations-root "${RUNNER_TEMP}/alred-operations"
          parser_smoke_status=$?
          set -e
          test "${parser_smoke_status}" -eq 3
          find "${RUNNER_TEMP}/alred-operations" -name snapshot.json -exec \
            jq -e \
              '.hosts.leaf01.sources.inventory.parse_status == "parsed" and .hosts.leaf01.sources.license_usage.parse_status == "parsed"' \
              {} \;

      - name: Smoke-test Route Diff and Health integration
        run: >-
          uv run --frozen python scripts/smoke_route_diff.py
          --command ./dist/alred
          --output "${RUNNER_TEMP}/alred-route-smoke"
