[project]
name = "alred"
version = "0.2.0a2"
description = "Collect LLDP and running-config, normalize links, generate containerlab, Mermaid, Terraform, and VNI outputs, and push config to devices"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["network", "lldp", "containerlab", "mermaid", "terraform", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking",
]
dependencies = [
  "Jinja2>=3.1.4",
  "jsonschema>=4.23.0",
  "netmiko>=4.4.0",
  "PyYAML>=6.0.2",
  "python-dotenv>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/suzuyu/alred"
Repository = "https://github.com/suzuyu/alred"
Issues = "https://github.com/suzuyu/alred/issues"

[project.scripts]
alred = "alred.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alred"]

[tool.hatch.build]
ignore-vcs = true
include = [
  "/alred/**/*.py",
  "/alred/health/profiles/*.yaml",
  "/alred/capabilities/*.yaml",
  "/alred/schemas/**/*.json",
  "/alred/j2/*.j2",
  "/alred/sample_configs/*",
  "/README.md",
  "/CONFIG.md",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]
build = [
  "pyinstaller>=6.11,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
]
markers = [
  "unit: external accessを伴わない単体テスト",
  "integration: 複数componentまたはCLIの統合テスト",
  "device: labまたは実機への接続が必要なテスト",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Phase 0では実行時障害につながるruleから開始し、既存codeの一括整形は行わない。
select = ["E9", "F63", "F7", "F82"]
