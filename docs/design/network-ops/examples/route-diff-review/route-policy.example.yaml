# 設計レビュー用。現行 CLI / モックはこの policy を評価しない。
api_version: alred/v1
kind: RouteDiffPolicy
metadata:
  name: required-routes-example
spec:
  required_routes:
    - device: leaf01
      vrf: TENANT-A
      family: ipv4
      prefix: 198.51.100.0/24
      min_paths: 1
      expected_next_hops:
        match: contains
        paths:
          - kind: ip
            next_hop_family: ipv4
            address: 192.0.2.1
            interface: Ethernet1/1
            next_hop_vrf: TENANT-A
    - device: leaf01
      vrf: TENANT-A
      family: ipv4
      prefix: 198.51.100.128/25
      min_paths: 2
    - device: leaf01
      vrf: TENANT-A
      family: ipv6
      prefix: 2001:db8:100::/64
      min_paths: 1
      expected_next_hops:
        match: exact
        paths:
          - kind: ip
            next_hop_family: ipv6
            address: fe80::1
            interface: Ethernet1/1
            next_hop_vrf: TENANT-A
  exclusions:
    - device: leaf02
      vrf: default
      family: ipv4
      prefix: 203.0.113.0/24
      reason: 例示用の discard 経路を正常性の評価対象から除外。観測 diff には保持する。
