api_version: alred/v1
kind: HealthCheckProfile
metadata:
  name: network-baseline-nxos
  version: "1.0"
  description: Initial common NX-OS offline baseline
spec:
  platforms:
    - nxos
  collectors:
    nxos:
      commands:
        - id: clock
          command: show clock
          required: false
        - id: show_version
          command: show version
          required: true
        - id: processes_cpu
          command: show processes cpu
          required: true
        - id: system_resources
          command: show system resources
          required: true
        - id: environment
          command: show environment
          required: true
        - id: ntp_status
          command: show ntp status
          required: false
        - id: ntp_peers
          command: show ntp peers
          required: false
        - id: ntp_peer_status
          command: show ntp peer-status
          required: false
        - id: interface_status
          command: show interface status
          required: false
        - id: interface_errors
          command: show interface counters errors non-zero
          required: false
        - id: port_channel_summary
          command: show port-channel summary
          required: false
        - id: reload_pending
          command: show system config reload-pending
          required: true
        - id: running_config_diff
          command: show running-config diff unified
          required: false
        - id: show_logging
          command: show logging
          required: true
        - id: route_summary_ipv4
          command: show ip route summary vrf all
          required: true
        - id: ospf_neighbors
          command: show ip ospf neighbors
          required: false
        - id: bgp_ipv4_summary
          command: show bgp ipv4 unicast summary vrf all
          required: false
        - id: vpc_brief
          command: show vpc brief
          required: false
  checks:
    - id: collection_complete
      evaluator: collection_complete
      severity: fail
    - id: system_identity
      evaluator: system_identity
      severity: fail
    - id: cpu_utilization
      evaluator: cpu_utilization
      severity: warn
    - id: memory_utilization
      evaluator: memory_utilization
      severity: warn
    - id: environment_health
      evaluator: environment_health
      severity: fail
    - id: clock_health
      evaluator: clock_health
      severity: fail
    - id: ntp_health
      evaluator: ntp_health
      severity: fail
    - id: interface_health
      evaluator: interface_health
      severity: fail
    - id: interface_error_health
      evaluator: interface_error_health
      severity: warn
    - id: port_channel_health
      evaluator: port_channel_health
      severity: fail
    - id: reload_pending
      evaluator: reload_pending
      severity: fail
    - id: running_config_diff
      evaluator: running_config_diff
      severity: warn
    - id: logging_health
      evaluator: logging_health
      severity: warn
    - id: ipv4_route_count
      evaluator: ipv4_route_count
      severity: fail
    - id: ospf_neighbor_health
      evaluator: ospf_neighbor_health
      severity: fail
    - id: bgp_ipv4_health
      evaluator: bgp_ipv4_health
      severity: fail
    - id: vpc_health
      evaluator: vpc_health
      severity: fail
  thresholds:
    logging:
      severity_threshold: 4
      lookback_seconds: 604800
      include_patterns: []
      exclude_patterns: []
    cpu:
      metric: one_minute_percent
      warn_percent: 80
      required_consecutive_samples: 3
      sample_interval_seconds: 15
    memory:
      warn_percent: 85
      fail_percent: 95
    clock:
      warn_offset_seconds: 60
      fail_offset_seconds: 300
    ntp:
      required: false
    interface_errors:
      warn_delta: 1
      fail_delta: 100
    route_count:
      warn_decrease_percent: 10
      fail_decrease_percent: 30
  operation_gate:
    interactive_action: confirm
    non_interactive_action: abort
  convergence:
    interval_seconds: 15
    timeout_seconds: 300
    consecutive_passes: 2
